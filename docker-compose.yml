version: "3.9"

# ============================================
# AI出行管家 · Docker Compose
# ============================================

services:
  # --- 行智 · Journey Hub (8001) ---
  journey-hub:
    build:
      context: ./services/journey-hub
      dockerfile: Dockerfile
    container_name: travel-journey
    ports:
      - "${JOURNEY_PORT:-8001}:8001"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - PLANNER_SERVICE_URL=http://planner-core:8002
      - SENSE_SERVICE_URL=http://sense-engine:8003
      - DEV_API_KEY=${DEV_API_KEY:-ak_dev_local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-false}
    volumes:
      - ./shared:/app/shared
    depends_on:
      planner-core:
        condition: service_started
    restart: unless-stopped

  # --- 策程 · Planner Core (8002) ---
  planner-core:
    build:
      context: ./services/planner-core
      dockerfile: Dockerfile
    container_name: travel-planner
    ports:
      - "${PLANNER_PORT:-8002}:8002"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - TRIP_DATA_DIR=/data/trips
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY:-}
      - TENCENT_MAP_SK=${TENCENT_MAP_SK:-}
      - DEV_API_KEY=${DEV_API_KEY:-ak_dev_local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-false}
    volumes:
      - ./shared:/app/shared
      - trip_data:/data/trips
    restart: unless-stopped

  # --- 感知 · Sense Engine (8003) ---
  sense-engine:
    build:
      context: ./services/sense-engine
      dockerfile: Dockerfile
    container_name: travel-sense
    ports:
      - "${SENSE_PORT:-8003}:8003"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_BASE_URL=${WEATHER_BASE_URL:-https://devapi.qweather.com}
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY:-}
      - TENCENT_MAP_SK=${TENCENT_MAP_SK:-}
      - FLIGHT_API_KEY=${FLIGHT_API_KEY:-}
      - DEV_API_KEY=${DEV_API_KEY:-ak_dev_local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-false}
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped

volumes:
  trip_data:
